# Gradle JVM Heap - behebt "running out of JVM heap space"
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m

# Parallele Builds aktivieren
org.gradle.parallel=true

# Gradle Build Cache
org.gradle.caching=true

# AndroidX aktivieren
android.useAndroidX=true

# Kotlin Code Style
kotlin.code.style=official

# Compose Compiler Metrics deaktivieren (spart Speicher)
android.enableComposeCompilerMetrics=false
android.enableComposeCompilerReports=false

# Unterdrückt die Warnung dass AGP 8.5.0 nur bis compileSdk=34 getestet wurde
android.suppressUnsupportedCompileSdk=35
